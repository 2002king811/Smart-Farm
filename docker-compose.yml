# Local development stack: `docker compose up`.
# Host ports avoid the usual defaults (5173, 8000, 5432, 6379…) so Smart Farm can run next to
# other projects. Override any of them with an environment variable, e.g. WEB_PORT=5190.
# Every value here is a development default; real secrets never go in this file.
x-backend: &backend
  build: { context: ./backend, target: dev }
  volumes: ["./backend:/app"]
  environment: &backend-env
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key-change-me-0123456789abcdef}
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api,websocket
    DATABASE_URL: postgres://smartfarm:smartfarm@db:5432/smartfarm
    REDIS_URL: redis://redis:6379/0
    CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5180},http://127.0.0.1:${WEB_PORT:-5180}
    FRONTEND_URL: http://localhost:${WEB_PORT:-5180}
    EMAIL_HOST: mailpit
    EMAIL_PORT: "1025"
    MESSAGING_ADAPTER: console
    USE_S3: ${USE_S3:-true}
    S3_ENDPOINT_URL: http://minio:9000
    S3_PUBLIC_DOMAIN: ""
    S3_ACCESS_KEY_ID: smartfarm
    S3_SECRET_ACCESS_KEY: smartfarm-dev-secret
    S3_BUCKET: smartfarm
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartfarm
      POSTGRES_USER: smartfarm
      POSTGRES_PASSWORD: smartfarm
    ports: ["${DB_PORT:-5433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartfarm -d smartfarm"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartfarm
      MINIO_ROOT_PASSWORD: smartfarm-dev-secret
    ports: ["${MINIO_PORT:-9010}:9000", "${MINIO_CONSOLE_PORT:-9011}:9001"]
    volumes: ["miniodata:/data"]

  minio-setup:
    image: quay.io/minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 smartfarm smartfarm-dev-secret; do sleep 1; done;
      mc mb --ignore-existing local/smartfarm"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["${MAILPIT_PORT:-8026}:8025", "${MAILPIT_SMTP_PORT:-1026}:1025"]

  # Migrations run as their own step, before the app containers start.
  migrate:
    <<: *backend
    command: python manage.py migrate --noinput
    restart: "no"

  api:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    ports: ["${API_PORT:-8010}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  websocket:
    <<: *backend
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8001 --reload
    ports: ["${WS_PORT:-8011}:8001"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: celery -A config worker -l info
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *backend
    command: celery -A config beat -l info
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ./frontend, target: dev }
    environment:
      VITE_PROXY_TARGET: http://api:8000
      VITE_WS_PROXY_TARGET: http://websocket:8001
    ports: ["${WEB_PORT:-5180}:5180"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
