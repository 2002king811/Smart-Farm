name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartfarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/smartfarm
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Type-check
        run: mypy
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Frontend permission matrix is in sync
        run: python manage.py export_permissions --check
      - name: OpenAPI schema is up to date
        run: |
          python manage.py spectacular --file openapi.json --format openapi-json --validate --fail-on-warn
          git diff --exit-code openapi.json
      - name: Tests (incl. tenancy isolation) with coverage
        run: pytest --create-db --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: |
          npm run lint
          npm run format:check
      - name: API client matches the OpenAPI schema
        run: |
          npm run api:generate
          git diff --exit-code src/api/schema.d.ts
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # Build the images; on main and on version tags also push them to GitHub's registry.
  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - id: push
        run: echo "push=${{ github.event_name == 'push' }}" >> "$GITHUB_OUTPUT"
      - if: steps.push.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image (api, websocket, worker, beat)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          push: ${{ steps.push.outputs.push == 'true' }}
          tags: ghcr.io/2002king811/smart-farm/api:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: prod
          push: ${{ steps.push.outputs.push == 'true' }}
          tags: ghcr.io/2002king811/smart-farm/web:${{ steps.tag.outputs.tag }}

  # Staging: every merge to main. Needs repository variables STAGING_HOST and STAGING_URL and
  # secrets STAGING_SSH_KEY (and STAGING_USER, default "deploy"). Skipped until they exist.
  deploy-staging:
    if: github.ref == 'refs/heads/main' && vars.STAGING_HOST != ''
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (pull, migrate, restart)
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ vars.STAGING_HOST }}
          USER: ${{ vars.STAGING_USER || 'deploy' }}
          TAG: ${{ needs.images.outputs.tag }}
        run: ./deploy/deploy.sh

  # The full end-to-end suite against staging.
  e2e-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright against staging
        env:
          E2E_BASE_URL: ${{ vars.STAGING_URL }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          install -m 600 /dev/null ~/.ssh_key && echo "$SSH_KEY" > ~/.ssh_key
          export E2E_MANAGE="ssh -i ~/.ssh_key -o StrictHostKeyChecking=accept-new ${{ vars.STAGING_USER || 'deploy' }}@${{ vars.STAGING_HOST }} cd smart-farm/deploy '&&' docker compose -f docker-compose.prod.yml exec -T api python manage.py"
          npx playwright test --trace off

  # Production: a version tag (v1.0.0). Protect the "production" environment with required
  # reviewers so a person approves each release.
  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_HOST != ''
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (pull, migrate, restart)
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          HOST: ${{ vars.PRODUCTION_HOST }}
          USER: ${{ vars.PRODUCTION_USER || 'deploy' }}
          TAG: ${{ needs.images.outputs.tag }}
        run: ./deploy/deploy.sh
