[project]
name = "smartfarm-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "BLE", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF012", "S101", "DJ012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"config/settings/test.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["migrations/", ".venv/", "tests/"]
files = ["apps", "config"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--reuse-db -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:celery.*"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/admin.py", "*/apps.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
