<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;background:#f6f8f6;font-family:Inter,Arial,sans-serif;color:#1a2b1c">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f8f6;padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e2e8e2">
        <tr><td style="background:#1B5E20;color:#ffffff;padding:18px 24px;font-size:18px;font-weight:700">
          {% if logo_url %}<img src="{{ logo_url }}" alt="" width="32" height="32" style="vertical-align:middle;border-radius:6px;margin-right:8px">{% endif %}
          {{ farm_name|default:"Smart Farm" }}
        </td></tr>
        <tr><td style="padding:24px">
          <h1 style="font-size:20px;margin:0 0 12px">{{ subject }}</h1>
          <p style="font-size:15px;line-height:1.55;margin:0 0 20px;white-space:pre-line">{{ text }}</p>
          {% if link %}<a href="{{ link }}" style="display:inline-block;background:#1B5E20;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:600">Open in Smart Farm</a>{% endif %}
        </td></tr>
        <tr><td style="padding:16px 24px;font-size:12px;color:#5b6b5d;border-top:1px solid #e2e8e2">
          You get this because of your notification settings in Smart Farm. Change them under Settings → Notifications.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
